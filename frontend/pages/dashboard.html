<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OffWeGo - Dashboard</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <!-- Logo -->
            <div class="logo">
                <span class="logo-text">OffWeGo</span>
                <span class="logo-plane">✈</span>
                
            </div>

<!-- </div> -->
            <!-- Navigation -->
            <nav class="sidebar-nav">

                <a href="dashboard.html" class="nav-item active">
                    <span class="nav-icon">▦</span>
                    <span>Dashboard</span>
                </a>

                <a href="mytrips.html" class="nav-item">
                    <span class="nav-icon">▣</span>
                    <span>My Trips</span>
                </a>

                <a href="wishlist.html" class="nav-item">
                    <span class="nav-icon">♡</span>
                    <span>Wishlist</span>
                </a>

                <a href="#" class="nav-item">
                    <span class="nav-icon">▤</span>
                    <span>Bookings</span>
                </a>

                <a href="assistant.html" class="nav-item">
                    <span class="nav-icon">◉</span>
                    <span>Travel Assistant</span>
                </a>

                <a href="profile.html" class="nav-item">
                    <span class="nav-icon">♙</span>
                    <span>Profile</span>
                </a>

                <a href="#" class="nav-item">
                    <span class="nav-icon">⚙</span>
                    <span>Settings</span>
                </a>

            </nav>

            <!-- Logout -->
            <div class="sidebar-bottom">

                <button class="logout-btn" id="logoutBtn">
                    <span>⇥</span>
                    <span>Log out</span>
                </button>

            </div>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- TOP BAR -->
            <header class="topbar">

                <div></div>

                <div class="topbar-right">

                    <div class="profile-avatar" id="profileAvatar">
                    U
                    </div>

                </div>

            </header>


            <!-- DASHBOARD CONTENT -->
            <section class="dashboard-content">

                <!-- Welcome -->
                <div class="welcome-section">

                    <div>
                        <h1>
                        Hello, <span id="userName">Explorer</span>! 👋
                        </h1>

                        <p>
                            Where do you want to go next?
                        </p>
                    </div>

                    <button class="new-trip-btn" id="newTripBtn">
                        <span>+</span>
                        New Trip
                    </button>

                </div>


                <!-- YOUR TRIPS -->
                <section class="trips-section">

                    <h2>Your Trips</h2>

                    <div class="trip-grid" id="tripGrid">
                        
                    </div>

                    <div class="view-all-container" id="viewAllContainer">

                    <a href="mytrips.html" class="view-all-btn">
                    View All Trips →
                    </a>

                    </div>
                        
                </section>


                <!-- SURPRISE ME -->
                <section class="surprise-card">

                    <div class="surprise-text">

                        <h2>
                            Not sure where to go?
                        </h2>

                        <p>
                            Let our AI suggest the perfect destination for you.
                        </p>

                        <button id="surpriseBtn">
                            Surprise Me ✨
                        </button>

                    </div>

                    <div class="surprise-image">
                        🗺️
                    </div>

                </section>

            </section>

        </main>

    </div>
</div>

    <script src="../js/dashboard.js"></script>

</body>
</html>
