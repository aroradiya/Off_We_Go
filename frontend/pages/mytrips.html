<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Trips - OffWeGo</title>

    <link
        rel="stylesheet"
        href="../css/mytrips.css"
    >

</head>


<body>

    <!-- ================================
         TOP BAR
    ================================= -->

    <header class="topbar">

        <a
            href="dashboard.html"
            class="logo"
        >
            <span class="logo-text">
                OffWeGo
            </span>

            <span class="logo-plane">
                ✈
            </span>

        </a>


        <a
            href="dashboard.html"
            class="back-link"
        >
            ← Back to Dashboard
        </a>

    </header>


    <!-- ================================
         MAIN CONTENT
    ================================= -->

    <main class="my-trips-page">

        <section class="page-heading">

            <h1>
                My Trips
            </h1>

            <p>
                View and manage all your planned journeys.
            </p>

        </section>


        <!-- TRIPS -->

        <section class="trips-section">

        <div id="upcomingSection">

            <h2>Upcoming Trips</h2>

            <div class="trip-grid" id="upcomingGrid">
            </div>

        </div>


        <div id="completedSection">

            <h2>Completed Trips</h2>

            <div class="trip-grid" id="completedGrid">
            </div>

        </div>

    </section>

    </main>


    <script src="../js/mytrips.js"></script>

</body>

</html>
