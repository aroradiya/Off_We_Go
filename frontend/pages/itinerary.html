<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trip Itinerary - OffWeGo</title>

    <link rel="stylesheet" href="../css/itinerary.css">

</head>

<body>

    <main class="itinerary-page">

        <a href="dashboard.html" class="back-link">
            ← Back to Dashboard
        </a>

        <h1 id="tripDestination">
            Trip Itinerary
        </h1>

        <p id="tripDates"></p>

        <div class="trip-details">

            <p>
                <strong>Travellers:</strong>
                <span id="tripTravellers"></span>
            </p>

            <p>
                <strong>Budget:</strong>
                <span id="tripBudget"></span>
            </p>

            <p>
                <strong>Interests:</strong>
                <span id="tripInterests"></span>
            </p>

            <p>
                <strong>Notes:</strong>
                <span id="tripNotes"></span>
            </p>

        </div>

        <div class="trip-actions">

            <a href="trip.html" id="editTripButton" class="edit-trip-btn">
                ✎ Edit trip
            </a>

            <button type="button" id="deleteTripButton" class="delete-trip-btn">
                🗑 Delete trip
            </button>

        </div>

    </main>

    <!-- =========================================
     ITINERARY
========================================= -->

<section class="itinerary-section">

    <div class="workspace-tabs">

        <button type="button" id="tabItinerary" class="workspace-tab active">
            🗓 Itinerary
        </button>

        <button type="button" id="tabBookings" class="workspace-tab">
            🎫 Bookings <span id="bookingCount"></span>
        </button>

    </div>

    <div id="itineraryPanel">

    <div class="section-heading section-heading-row">

        <div>

            <h2>Your Itinerary</h2>

            <p>
                A day-by-day plan for your trip. Add, edit, remove or reorder activities.
            </p>

        </div>

        <div class="itinerary-tools">

            <span id="itineraryStatus" class="itinerary-status"></span>

            <button type="button" id="resetItineraryButton" class="reset-itinerary-btn">
                ↺ Reset to suggested plan
            </button>

        </div>

    </div>

    <div id="itineraryContainer" class="itinerary-container">
        <!-- JavaScript will generate the itinerary here -->
    </div>

    </div>

    <div id="bookingsPanel" hidden>

        <div class="section-heading section-heading-row">

            <div>

                <h2>Your Bookings</h2>

                <p>
                    Keep your flights, stays and other bookings for this trip in one place.
                </p>

            </div>

            <div class="itinerary-tools">

                <button type="button" id="addBookingButton" class="small-btn primary">
                    + Add booking
                </button>

            </div>

        </div>

        <div id="bookingSummary" class="booking-summary"></div>

        <div id="bookingFormArea"></div>

        <div id="bookingList" class="booking-list"></div>

    </div>

</section>

    <script src="../js/api.js"></script>
    <script src="../js/itinerary.js"></script>
    <script src="../js/bookingsfront.js"></script>

</body>

</html>
